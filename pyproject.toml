[project]
name = "podcast-analysis"
version = "0.1.0"
description = "播客订阅、独立转录服务编排与 agy Markdown 阅读"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.0.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.0", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
